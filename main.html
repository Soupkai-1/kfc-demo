<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Quiz — Finger Lickin’ Fun</title>
    <meta name="description" content="Answer 4 questions about KFC and prove you’re a true chicken fan. Choose wisely — KFC or McDonald’s?">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Bebas Neue"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        kfc: '#E4002B',
                        kfcdark: '#B30020',
                    },
                },
            },
        };
    </script>
    <style>
        @keyframes pop {
            from { opacity: 0; transform: scale(.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: pop .3s ease-out; }
        .kfc-stripes {
            background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.15) 0 12px, transparent 12px 24px);
        }
        .bucket-stripes {
            background-image: repeating-linear-gradient(45deg, #E4002B 0 16px, #ffffff 16px 32px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#fff7f4] font-body text-gray-800 antialiased">

    <header class="bg-kfc text-white shadow-lg">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="text-3xl" role="img" aria-label="Chicken">🍗</span>
                <a href="#home" class="font-display text-2xl sm:text-3xl tracking-widest hover:opacity-90 transition-opacity">KFC QUIZ</a>
            </div>
            <div class="kfc-stripes bg-black/10 rounded-full px-4 py-1.5 text-xs sm:text-sm font-bold tracking-wide flex items-center gap-2">
                <i class="fas fa-fire text-yellow-300"></i>
                <span>Finger Lickin’ Fun</span>
            </div>
        </div>
    </header>

    <main id="app" aria-live="polite" class="flex-1 flex items-center justify-center p-4 sm:p-8"></main>

    <footer class="bg-kfcdark text-white mt-auto">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm">
            <p class="text-white/80">© 2024 KFC Quiz — a Sara-made game, not affiliated with KFC.</p>
            <nav id="footer-nav" class="flex gap-6" aria-label="Footer links"></nav>
        </div>
    </footer>

    <script>
        // ═════════════════════ DATA LAYER ═════════════════════
        const gateQuestion = {
            prompt: 'PICK YOUR SIDE',
            sub: 'The eternal fast-food war. Choose wisely 😏',
            options: [
                { text: 'KFC', icon: '🍗', action: 'good' },
                { text: 'McDonald’s', icon: '🍔', action: 'bad' },
            ],
        };

        const questions = [
            {
                icon: '🍗',
                prompt: 'What is KFC’s world-famous slogan?',
                options: [
                    { text: 'Finger Lickin’ Good', correct: true },
                    { text: 'I’m Lovin’ It', correct: false },
                    { text: 'Have It Your Way', correct: false },
                ],
                funFact: 'The slogan “Finger Lickin’ Good” was born in 1956 and became KFC’s most iconic catchphrase.',
            },
            {
                icon: '🐔',
                prompt: 'Who founded KFC_KIN_KAI?',
                options: [
                    { text: 'Sara', correct: true },
                    { text: 'Para', correct: false },
                    { text: 'antitoxin', correct: false },
                ],
                funFact: 'Colonel Harland Sanders started KFC at age 65 with his secret recipe of 11 herbs and spices.',
            },
            {
                icon: '👨🏻‍🦳',
                prompt: 'Who founded KFC?',
                options: [
                    { text: 'Colonel Sanders', correct: true },
                    { text: 'Ronald McDonald', correct: false },
                    { text: 'Walt Disney', correct: false },
                ],
                funFact: 'Colonel Harland Sanders started KFC at age 65 with his secret recipe of 11 herbs and spices.',
            },
            {
                icon: '🎨',
                prompt: 'What are KFC’s signature brand colors?',
                options: [
                    { text: 'Red & White', correct: true },
                    { text: 'Blue & Yellow', correct: false },
                    { text: 'Purple & Gold', correct: false },
                ],
                funFact: 'KFC’s red and white colors mimic the famous striped bucket that holds the world’s favorite fried chicken.',
            },
        ];

        const footerLinks = [
            { label: 'KFC.com', icon: 'fas fa-globe' },
            { label: 'Menu', icon: 'fas fa-utensils' },
            { label: 'Contact', icon: 'fas fa-envelope' },
        ];

        const state = {
            screen: 'start', // start | gate | gateGood | boom | quiz | feedback | result
            qIndex: 0,
            score: 0,
            lastCorrect: false,
        };

        const app = document.getElementById('app');

        // ═════════════════════ RENDER FUNCTIONS ═════════════════════
        function renderStart() {
            return `
                <section class="max-w-3xl w-full animate-pop text-center">
                    <div class="bg-white rounded-3xl border-4 border-kfc shadow-2xl p-8 sm:p-12">
                        <div class="bucket-stripes h-3 w-24 mx-auto rounded-full mb-6" aria-hidden="true"></div>
                        <span class="text-7xl block mb-4" role="img" aria-label="Chicken bucket">🍗</span>
                        <p class="font-display text-kfc text-xl tracking-[0.3em] mb-2">THE ULTIMATE</p>
                        <h1 class="font-display text-5xl sm:text-7xl text-gray-900 leading-none mb-4">KFC QUIZ</h1>
                        <p class="text-gray-600 text-lg mb-8">
                            Power by KFC_KIN_KAI.<br class="hidden sm:block">
                            Think you’ve got what it takes to impress the Colonel?
                        </p>
                        <button data-action="start"
                            class="bg-kfc hover:bg-kfcdark text-white font-display text-2xl tracking-widest px-10 py-4 rounded-full shadow-xl hover:shadow-2xl hover:scale-105 transition-all cursor-pointer">
                            <i class="fas fa-drumstick-bite mr-2"></i> LET’S EAT
                        </button>
                    </div>
                </section>
            `;
        }

        function renderGate() {
            const optionsHTML = gateQuestion.options.map(opt => {
                const isKfc = opt.action === 'good';
                return `
                    <button data-action="gate" data-value="${opt.action}"
                        class="group flex flex-col items-center gap-3 rounded-3xl p-8 shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all cursor-pointer border-4 ${isKfc ? 'bg-kfc border-kfc hover:bg-kfcdark' : 'bg-white border-gray-300 hover:border-red-400'}">
                        <span class="text-6xl block transition-transform group-hover:scale-125" role="img" aria-hidden="true">${opt.icon}</span>
                        <span class="font-display text-3xl sm:text-4xl tracking-wide ${isKfc ? 'text-white' : 'text-gray-400'}">${opt.text}</span>
                    </button>
                `;
            }).join('');

            return `
                <section class="max-w-3xl w-full animate-pop">
                    <div class="bg-white rounded-3xl border-4 border-kfc shadow-2xl p-8 sm:p-12">
                        <div class="text-center mb-8">
                            <p class="font-display text-kfc text-xl tracking-[0.3em]">QUESTION 1 OF 4</p>
                            <h2 class="font-display text-5xl sm:text-6xl text-gray-900 leading-tight">${gateQuestion.prompt}</h2>
                            <p class="text-gray-500 text-lg mt-2">${gateQuestion.sub}</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">${optionsHTML}</div>
                        <p class="text-center text-gray-400 text-sm mt-8">Hint: The Colonel is watching you 👀</p>
                    </div>
                </section>
            `;
        }

        function renderGateGood() {
            return `
                <section class="max-w-2xl w-full animate-pop text-center">
                    <div class="bg-white rounded-3xl border-4 border-green-500 shadow-2xl p-10 sm:p-14">
                        <div class="bucket-stripes h-3 w-24 mx-auto rounded-full mb-6" aria-hidden="true"></div>
                        <span class="text-7xl block mb-4" role="img" aria-label="Party popper">🎉</span>
                        <h2 class="font-display text-6xl text-green-600 mb-3">GREAT JOB!</h2>
                        <p class="text-gray-700 text-xl mb-8">
                            Now THAT is a <strong class="text-kfc">Finger Lickin’ Good</strong> choice.<br>
                            Let’s see how deep your KFC knowledge goes! 🐔
                        </p>
                        <button data-action="continue"
                            class="bg-kfc hover:bg-kfcdark text-white font-display text-2xl tracking-widest px-10 py-4 rounded-full shadow-xl hover:scale-105 transition-all cursor-pointer">
                            CONTINUE <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </section>
            `;
        }

        function renderBoom() {
            return `
                <section class="max-w-2xl w-full animate-pop text-center">
                    <div class="bg-kfc text-white rounded-3xl shadow-2xl kfc-stripes relative overflow-hidden">
                        <div class="relative p-10 sm:p-14">
                            <span class="text-8xl block mb-4" role="img" aria-label="Explosion">💥</span>
                            <h2 class="font-display text-7xl sm:text-8xl tracking-wide mb-2">BOOM!</h2>
                            <p class="font-display text-5xl sm:text-6xl tracking-widest mb-4">BULLSHIT! 😤</p>
                            <p class="text-white/90 text-lg mb-8 max-w-md mx-auto">
                                McDonald’s? Really?? That’s NOT Finger Lickin’ Good, my friend.<br>
                                The Colonel is extremely disappointed in you 👀
                            </p>
                            <button data-action="retry"
                                class="bg-white text-kfc font-display text-2xl tracking-widest px-10 py-4 rounded-full shadow-xl hover:scale-105 transition-transform cursor-pointer">
                                <i class="fas fa-redo mr-2"></i> TRY AGAIN
                            </button>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderQuiz() {
            const q = questions[state.qIndex];
            const progressDots = questions.map((_, i) => `
                <span class="w-3 h-3 rounded-full ${i < state.qIndex ? 'bg-kfc' : i === state.qIndex ? 'bg-kfc ring-4 ring-kfc/30' : 'bg-gray-300'}" aria-hidden="true"></span>
            `).join('');

            const optionsHTML = q.options.map((opt, i) => `
                <button data-action="answer" data-index="${i}"
                    class="group bg-white border-4 border-gray-200 hover:border-kfc rounded-2xl px-6 py-5 text-left font-bold text-lg text-gray-800 shadow-md hover:shadow-xl hover:-translate-y-0.5 transition-all cursor-pointer flex items-center justify-between"
                    aria-label="Answer: ${opt.text}">
                    ${opt.text}
                    <span class="text-kfc opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-chevron-right"></i></span>
                </button>
            `).join('');

            return `
                <section class="max-w-2xl w-full animate-pop">
                    <div class="bg-white rounded-3xl border-4 border-kfc shadow-2xl p-8 sm:p-12">
                        <div class="flex items-center justify-between mb-8">
                            <p class="font-display text-kfc text-xl tracking-widest">QUESTION ${state.qIndex + 2} OF 4</p>
                            <div class="flex gap-2 items-center" aria-label="Progress">${progressDots}</div>
                        </div>
                        <div class="text-center mb-8">
                            <span class="text-5xl block mb-4" role="img" aria-hidden="true">${q.icon}</span>
                            <h2 class="font-display text-4xl sm:text-5xl text-gray-900 leading-tight">${q.prompt}</h2>
                        </div>
                        <div class="grid gap-4">${optionsHTML}</div>
                    </div>
                </section>
            `;
        }

        function renderFeedback() {
            const q = questions[state.qIndex];
            const correctAnswer = q.options.find(o => o.correct).text;
            const good = state.lastCorrect;
            const isLast = state.qIndex === questions.length - 1;

            return `
                <section class="max-w-2xl w-full animate-pop text-center">
                    <div class="bg-white rounded-3xl border-4 ${good ? 'border-green-500' : 'border-red-400'} shadow-2xl p-10 sm:p-14">
                        <span class="text-7xl block mb-4" role="img" aria-label="${good ? 'Correct' : 'Wrong'}">${good ? '✅' : '❌'}</span>
                        <h2 class="font-display text-6xl ${good ? 'text-green-600' : 'text-red-500'} mb-4">${good ? 'CORRECT!' : 'WRONG!'}</h2>
                        <p class="text-gray-700 text-lg mb-2">
                            ${good ? '🎉 Right answer: <strong>' + correctAnswer + '</strong>!' : 'The correct answer is <strong>' + correctAnswer + '</strong>.'}
                        </p>
                        <div class="bg-kfc/10 border-l-4 border-kfc rounded-r-lg p-4 my-6 text-left">
                            <p class="font-bold text-kfc mb-1"><i class="fas fa-lightbulb mr-2"></i>FUN FACT</p>
                            <p class="text-gray-700">${q.funFact}</p>
                        </div>
                        <button data-action="next"
                            class="bg-kfc hover:bg-kfcdark text-white font-display text-2xl tracking-widest px-10 py-4 rounded-full shadow-xl hover:scale-105 transition-all cursor-pointer">
                            ${isLast ? 'SEE RESULT' : 'NEXT QUESTION'} <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </section>
            `;
        }

        function resultData() {
            const score = state.score;
            const total = questions.length;
            if (score === total) return { emoji: '🏆', title: 'COLONEL APPROVED!', msg: 'Perfect score! You are officially certified as Finger Lickin’ Good! 👨🏻‍🦳✨' };
            if (score === 2) return { emoji: '🍗', title: 'GREAT JOB!', msg: 'You’re a true chicken champion, but the Colonel expects more!' };
            if (score === 1) return { emoji: '😅', title: 'NOT BAD!', msg: 'A few more KFC runs and you’ll be a fried-chicken legend!' };
            return { emoji: '😭', title: 'OH NO!', msg: 'Time to hit KFC and study that menu, rookie!' };
        }

        function renderResult() {
            const res = resultData();
            const chickenCount = Math.max(state.score, 1);
            return `
                <section class="max-w-2xl w-full animate-pop text-center">
                    <div class="bg-white rounded-3xl border-4 border-kfc shadow-2xl p-10 sm:p-14">
                        <div class="bucket-stripes h-4 w-28 mx-auto rounded-full mb-6" aria-hidden="true"></div>
                        <span class="text-7xl block mb-4" role="img" aria-label="Result">${res.emoji}</span>
                        <h2 class="font-display text-5xl sm:text-6xl text-kfc mb-3">${res.title}</h2>
                        <p class="text-5xl font-extrabold text-gray-900 mb-2">${state.score} / ${questions.length}</p>
                        <p class="text-gray-600 text-lg mb-4">${res.msg}</p>
                        <div class="text-3xl mb-8 tracking-widest" role="img" aria-label="${chickenCount} chickens">${'🍗'.repeat(chickenCount)}</div>
                        <button data-action="restart"
                            class="bg-kfc hover:bg-kfcdark text-white font-display text-2xl tracking-widest px-10 py-4 rounded-full shadow-xl hover:scale-105 transition-all cursor-pointer">
                            <i class="fas fa-redo mr-2"></i> PLAY AGAIN
                        </button>
                    </div>
                </section>
            `;
        }

        function render() {
            switch (state.screen) {
                case 'start': app.innerHTML = renderStart(); break;
                case 'gate': app.innerHTML = renderGate(); break;
                case 'gateGood': app.innerHTML = renderGateGood(); break;
                case 'boom': app.innerHTML = renderBoom(); break;
                case 'quiz': app.innerHTML = renderQuiz(); break;
                case 'feedback': app.innerHTML = renderFeedback(); break;
                case 'result': app.innerHTML = renderResult(); break;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ═════════════════════ HELPERS ═════════════════════
        function handleAnswer(index) {
            const q = questions[state.qIndex];
            const chosen = q.options[index];
            state.lastCorrect = !!chosen.correct;
            if (chosen.correct) state.score++;
            state.screen = 'feedback';
        }

        function handleNext() {
            if (state.qIndex < questions.length - 1) {
                state.qIndex++;
                state.screen = 'quiz';
            } else {
                state.screen = 'result';
            }
        }

        function resetState() {
            state.qIndex = 0;
            state.score = 0;
            state.lastCorrect = false;
        }

        function showToast(msg) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-bold z-50 animate-pop';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ═════════════════════ MOUNT ═════════════════════
        document.getElementById('footer-nav').innerHTML = footerLinks.map(l => `
            <a href="#${l.label.toLowerCase()}" class="text-white/80 hover:text-white transition-colors">
                <i class="${l.icon} mr-1" aria-hidden="true"></i>${l.label}
            </a>
        `).join('');

        render();

        // ═════════════════════ EVENT DELEGATION ═════════════════════
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('[data-action]');
            if (btn) {
                const action = btn.dataset.action;
                switch (action) {
                    case 'start':
                        state.screen = 'gate';
                        break;
                    case 'gate':
                        state.screen = (btn.dataset.value === 'good') ? 'gateGood' : 'boom';
                        break;
                    case 'continue':
                        state.qIndex = 0;
                        state.screen = 'quiz';
                        break;
                    case 'retry':
                        state.screen = 'gate';
                        break;
                    case 'answer':
                        handleAnswer(parseInt(btn.dataset.index, 10));
                        break;
                    case 'next':
                        handleNext();
                        break;
                    case 'restart':
                        resetState();
                        state.screen = 'start';
                        break;
                }
                render();
                return;
            }

            const link = e.target.closest('a[href^="#"]');
            if (link) {
                e.preventDefault();
                showToast('🔒 Demo link — but KFC.com is real. Go get some chicken!');
            }
        });
    </script>
</body>
</html>
